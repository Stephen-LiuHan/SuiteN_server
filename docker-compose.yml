services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suiten
      POSTGRES_PASSWORD: suiten_test
      POSTGRES_DB: suiten_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suiten -d suiten_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://suiten:suiten_test@postgres:5432/suiten_test?sslmode=disable
      JWT_SECRET: test-jwt-secret-key
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
